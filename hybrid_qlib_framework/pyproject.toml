[project]
name = "hybrid-qlib-framework"
version = "0.1.0"
description = "邏輯驅動的量化交易系統 - 基於 Qlib 框架與台指期真實數據"
readme = "README.md"
requires-python = ">=3.8,<3.12"
dependencies = [
    "qlib==0.9.5",
    "duckdb==0.9.2",
    "pandas==2.0.3",
    "pyarrow==14.0.1",
    "numpy==1.24.3",
    "scikit-learn==1.3.2",
    "lightgbm==4.1.0",
    "matplotlib==3.7.3",
    "seaborn==0.13.0",
    "pyyaml==6.0.1",
    "tqdm==4.66.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "black==23.11.0",
    "flake8==6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
